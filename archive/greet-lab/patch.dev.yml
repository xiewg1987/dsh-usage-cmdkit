# Dev overlay for harness source launch (paths relative to this file):
#   cd D:\ScriptProject\deepseek-harness
#   pnpm dsh web --patch ../dsh-plugin/patch.dev.yml
#
# 注意：这里的 name 是源码路径，只加载 Host 半（greet 工具）。
# Web 配置卡片（./client）只挂在「裸包名」行上，请改用：
#   dsh plugin --profile <name> add D:/ScriptProject/dsh-plugin
# （cordis.patch.yml 里 name: dsh-plugin，会带上 lib/client.js）
#
# 门禁名单只改这里即可（Host 联调）：
# - preDenyNames：执行前 deny（不跑 execute）
# - postBlockNames：执行后 block（勿与 preDenyNames 重叠）

- insert:
    - id: greet
      name: './src/hello-plugin.ts'
      config:
        greeting: 'Hey'
        preDenyNames:
          - forbidden
        postBlockNames:
          - Ada5
          - Ada6
